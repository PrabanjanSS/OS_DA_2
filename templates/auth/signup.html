{% extends "base.html" %}

{% block title %}Sign Up - AI Grading System{% endblock %}

{% block content %}
<div class="max-w-md mx-auto">
    <div class="card rounded-2xl p-8 shadow-xl">
        <h2 class="text-3xl font-bold text-dark mb-6 text-center">Sign Up</h2>
        
        <form method="POST" action="{{ url_for('auth.signup') }}">
            <div class="mb-4">
                <label class="block text-gray-700 font-medium mb-2">Full Name</label>
                <input type="text" name="name" required 
                    class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:border-primary focus:ring-2 focus:ring-primary/20 outline-none transition">
            </div>
            
            <div class="mb-4">
                <label class="block text-gray-700 font-medium mb-2">Email</label>
                <input type="email" name="email" required 
                    class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:border-primary focus:ring-2 focus:ring-primary/20 outline-none transition">
            </div>
            
            <div class="mb-4">
                <label class="block text-gray-700 font-medium mb-2">Password</label>
                <input type="password" name="password" required 
                    class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:border-primary focus:ring-2 focus:ring-primary/20 outline-none transition">
            </div>
            
            <div class="mb-6">
                <label class="block text-gray-700 font-medium mb-2">I am a</label>
                <select name="role" required 
                    class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:border-primary focus:ring-2 focus:ring-primary/20 outline-none transition">
                    <option value="">Select role</option>
                    <option value="teacher">Teacher</option>
                    <option value="student">Student</option>
                </select>
            </div>
            
            <button type="submit" class="w-full btn-primary text-white py-3 rounded-lg font-semibold">
                Create Account
            </button>
        </form>
        
        <p class="text-center mt-6 text-gray-600">
            Already have an account? 
            <a href="{{ url_for('auth.login') }}" class="text-primary hover:underline">Login</a>
        </p>
    </div>
</div>
{% endblock %}
