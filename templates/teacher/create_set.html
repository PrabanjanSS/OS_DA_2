{% extends "base.html" %}

{% block title %}Create question set{% endblock %}

{% block content %}
<a href="{{ url_for('teacher.dashboard') }}" class="breadcrumb">Back to dashboard</a>

<div class="narrow">
    <div class="card card--padded">
        <span class="eyebrow">New</span>
        <h1 class="title-md">Create question set</h1>
        <hr class="divider">

        <form method="POST" action="{{ url_for('teacher.create_set') }}">
            <div class="field">
                <label class="field-label" for="title">Set title</label>
                <input type="text" id="title" name="title" class="input" required
                    placeholder="e.g. Chapter 1 Quiz">
            </div>

            <div class="field">
                <label class="field-label" for="description">Description (optional)</label>
                <textarea id="description" name="description" class="textarea" rows="3"
                    placeholder="Brief description of this question set..."></textarea>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn--primary btn--block">Create set</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
