{% extends "base.html" %}

{% block title %}Create Question Set{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto">
    <div class="mb-6">
        <a href="{{ url_for('teacher.dashboard') }}" class="text-gray-400 hover:text-white transition">
            ← Back to Dashboard
        </a>
    </div>
    
    <div class="card rounded-2xl p-8 shadow-xl">
        <h2 class="text-3xl font-bold text-dark mb-6">Create Question Set</h2>
        
        <form method="POST" action="{{ url_for('teacher.create_set') }}">
            <div class="mb-4">
                <label class="block text-gray-700 font-medium mb-2">Set Title</label>
                <input type="text" name="title" required 
                    class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:border-primary focus:ring-2 focus:ring-primary/20 outline-none transition"
                    placeholder="e.g., Chapter 1 Quiz">
            </div>
            
            <div class="mb-6">
                <label class="block text-gray-700 font-medium mb-2">Description (Optional)</label>
                <textarea name="description" rows="3"
                    class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:border-primary focus:ring-2 focus:ring-primary/20 outline-none transition"
                    placeholder="Brief description of this question set..."></textarea>
            </div>
            
            <button type="submit" class="w-full btn-primary text-white py-3 rounded-lg font-semibold">
                Create Set
            </button>
        </form>
    </div>
</div>
{% endblock %}
